<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Leonote break</title>
<style>
  html { background: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; color: #ececf1; font: 13px/1.35 Inter, "Segoe UI", system-ui, sans-serif; user-select: none; }
  body { display: flex; flex-direction: column; box-sizing: border-box; background: #17181c; border-radius: 16px; box-shadow: inset 0 0 0 1px #34353c; position: relative; }
  #card { padding: 10px 12px 10px; display: flex; flex-direction: column; min-height: 0; flex: 1; }
  .head { display: flex; align-items: center; gap: 6px; font-weight: 650; cursor: default; }
  .head span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #e0a84a; flex: none; margin-right: 2px; }
  button { all: unset; cursor: pointer; border-radius: 7px; }
  button:focus-visible { outline: 2px solid #e0a84a; outline-offset: 1px; }
  .ib { width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; color: #9a9ca6; }
  .ib:hover { background: rgba(255,255,255,.1); color: #fff; }
  .ib svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .list { margin-top: 6px; overflow: auto; min-height: 0; }
  .row { display: flex; align-items: center; gap: 9px; padding: 5px 6px; border-radius: 8px; width: 100%; box-sizing: border-box; }
  .row:hover { background: rgba(255,255,255,.06); }
  .box { width: 15px; height: 15px; border-radius: 5px; border: 1.5px solid #6b6d76; flex: none; display: grid; place-items: center; }
  .row.is-done .box { background: #e0a84a; border-color: #e0a84a; }
  .row.is-done .box::after { content: ""; width: 8px; height: 4px; border-left: 2px solid #17181c; border-bottom: 2px solid #17181c; transform: rotate(-45deg) translate(1px, -1px); }
  .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.is-done .name { color: #8a8c96; text-decoration: line-through; }
  .sub { color: #9a9ca6; font-size: 12px; font-variant-numeric: tabular-nums; }
  .foot { margin-top: 6px; align-self: flex-start; color: #e0a84a; font-size: 12.5px; font-weight: 600; padding: 2px 4px; margin-left: 2px; }
  .foot:hover { text-decoration: underline; }
  /* the time it has left, running down along the bottom edge, as the in-app cards do */
  .clock { position: absolute; left: 14px; right: 14px; bottom: 5px; height: 2px; border-radius: 2px; background: rgba(255,255,255,.08); overflow: hidden; }
  .clock i { display: block; height: 100%; width: 100%; background: #e0a84a; transform-origin: left; }
  /* the resize grip: a soft arc hugging the rounded corner, brighter at its middle (as Kitsumi draws it) */
  .grip { position: absolute; right: 0; bottom: 0; width: 22px; height: 22px; cursor: nwse-resize; opacity: 0; transition: opacity .15s; }
  .grip::after { content: ""; position: absolute; right: 4px; bottom: 4px; width: 14px; height: 14px; border-right: 2px solid #e0a84a; border-bottom: 2px solid #e0a84a; border-bottom-right-radius: 12px;
    -webkit-mask-image: linear-gradient(135deg, transparent 20%, #000 55%, transparent 95%); mask-image: linear-gradient(135deg, transparent 20%, #000 55%, transparent 95%); filter: drop-shadow(0 0 3px rgba(224,168,74,.6)); }
  .grip:hover::after { border-color: #f2c06a; }
  body:hover .grip { opacity: 1; }
</style>
</head>
<body>
  <div id="card">
    <div class="head" id="head"><i class="dot"></i><span id="title">Break</span>
      <button class="ib" id="settings" title="Settings for this card (on the Timer page)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      <button class="ib" id="close" title="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="list" id="list"></div>
    <button class="foot" id="open">Open Leonote</button>
  </div>
  <div class="clock" id="clock" hidden><i id="clockFill"></i></div>
  <div class="grip" id="grip"></div>
  <script src="breakpop.js"></script>
</body>
</html>
