<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leonote break</title>
<!-- the app's own look: its font, colours and the break card's rows; the theme and accent come with each update -->
<link rel="stylesheet" href="style.css">
<style>
  html, body { background: transparent !important; margin: 0; height: 100%; overflow: hidden; user-select: none; }
  /* the window is the card: the in-app break card, filling its rounded window */
  body { display: flex; }
  #card { flex: 1; width: auto; max-width: none; opacity: 1; box-shadow: none; border-radius: 16px; position: relative; overflow: hidden; align-content: start; }
  .db-card-head { cursor: default; }
  .db-card-head b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #list { display: grid; gap: 2px; overflow: auto; min-height: 0; }
  .db-row { cursor: pointer; }
  .db-row .db-sub { color: var(--text-3); font-size: 12px; font-variant-numeric: tabular-nums; flex: none; }
  .bp-foot { justify-self: start; }
  #prefs { display: grid; gap: 2px; }
  #prefs[hidden] { display: none; }
  #settings.is-on { color: var(--accent); }
  /* the time it has left, along the bottom edge, as the in-app cards do */
  .cc-bar[hidden] { display: none; }
  /* the resize grip: a soft arc hugging the rounded corner (as Kitsumi draws it), shown on hover */
  .grip { position: absolute; right: 0; bottom: 0; width: 22px; height: 22px; cursor: nwse-resize; opacity: 0; transition: opacity .15s; }
  .grip::after { content: ""; position: absolute; right: 4px; bottom: 4px; width: 14px; height: 14px; border-right: 2px solid var(--accent); border-bottom: 2px solid var(--accent); border-bottom-right-radius: 12px;
    -webkit-mask-image: linear-gradient(135deg, transparent 20%, #000 55%, transparent 95%); mask-image: linear-gradient(135deg, transparent 20%, #000 55%, transparent 95%);
    filter: drop-shadow(0 0 3px color-mix(in srgb, var(--accent) 60%, transparent)); }
  body:hover .grip { opacity: 1; }
</style>
</head>
<body>
  <div class="db-card" id="card">
    <div class="db-card-head" id="head"><span id="ico"></span><b id="title">Break</b>
      <button class="icon-btn" id="settings" title="This card's settings"></button>
      <button class="icon-btn" id="close" title="Close"></button>
    </div>
    <div id="list"></div>
    <div id="prefs" hidden></div>
    <button class="link-btn bp-foot" id="open">Open Leonote</button>
    <div class="cc-bar" id="clock" hidden><div class="cc-bar-fill" id="clockFill"></div></div>
    <div class="grip" id="grip"></div>
  </div>
  <script type="module" src="breakpop.js"></script>
</body>
</html>
